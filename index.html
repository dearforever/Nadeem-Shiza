<style>

html,body{overflow-x:clip}

h1,h2,h3{font-weight:500}
.script{font-family:'Great Vibes',cursive;font-weight:400;color:var(--wine)}
section{position:relative;padding:84px 20px;max-width:960px;margin:auto;text-align:center}
.eyebrow{font-style:italic;color:var(--mut);letter-spacing:.04em}
h2.script{font-size:clamp(40px,9vw,60px);line-height:1.2;margin:4px 0 26px}
.orn{display:block;margin:10px auto 18px;width:150px;height:14px}
button,.btn{font:600 16px 'Cormorant Garamond',serif;letter-spacing:.14em;text-transform:uppercase;min-height:48px;padding:0 26px;border-radius:30px;border:1.5px solid var(--gold);background:var(--wine);color:#F6E7C6;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .25s,background .25s}
button:hover,.btn:hover{background:var(--rose);transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--wine)}

.card{background:var(--card);border:1px solid var(--gold2);border-radius:18px;padding:22px 18px;box-shadow:0 8px 24px rgba(110,20,35,.08),inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--gold2)}
.grid{display:grid;gap:16px;grid-template-columns:1fr 1fr}

.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease;transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

#seal{position:relative;z-index:2;width:128px;height:128px;border-radius:50%;padding:0;background:radial-gradient(circle at 35% 30%,#B03045,#6E1423 70%);border:3px solid #8f2a3a;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 6px rgba(230,206,152,.25);font:400 34px 'Great Vibes',cursive;color:#F0D9A0;letter-spacing:0;text-transform:none;flex-direction:column;gap:0}
#seal small{font:600 11px 'Cormorant Garamond';letter-spacing:.2em;text-transform:uppercase;margin-top:-2px}
#env.open #seal{animation:glow 1s forwards}

.ring{position:absolute;z-index:1;width:140px;height:140px;border-radius:50%;border:3px solid #ffe9a8;opacity:0}

.sp{position:absolute;z-index:3;width:8px;height:8px;background:#ffe3a0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:sp 1.4s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(2.2);opacity:0}}
#env .inv{position:absolute;bottom:12%;font-style:italic;letter-spacing:.3em;text-transform:uppercase;font-size:15px;color:var(--mut)}

#snd {position:fixed; z-index:95; top:calc(14px + env(safe-area-inset-top)); right:14px; width:44px; height:44px; border-radius:50%; background:var(--wine); border:2px solid var(--gold); color:#F6E7C6; cursor:pointer; font-size:22px; display:grid; place-items:center; box-shadow:0 4px 14px rgba(110,20,35,0.4); padding:0; min-height:0; transition: transform 0.3s;}

    ["Wedding","11 Dec 2026","Friday","7:00 PM","Kohand — Near Power House, Asandh Road","","2026-12-11T19:00:00+05:30"]
  ]
};
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches,
 B=C.bride||"Bride",G=C.groom||"Groom",names=C.order.startsWith("Bride")?[B,G]:[G,B];
const set=(id,t)=>{const e=$(id);if(!e)return;t?e.textContent=t:e.remove()};

/* ===== BACKGROUND AUDIO SETUP ===== */
const bgAudio = new Audio("https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3"); 
bgAudio.loop = true;
const sndBtn = document.getElementById('snd');

sndBtn.onclick = () => {
  if(bgAudio.paused) {
    bgAudio.play();
    sndBtn.classList.add('playing');
    sndBtn.innerHTML = '⏸';
  } else {
    bgAudio.pause();
    sndBtn.classList.remove('playing');
    sndBtn.innerHTML = '♪';
  }
};

/* ===== FILL CONTENT ===== */
$('#ini').textContent=C.initials||"&";
set('#bless',C.blessing);set('#sub',C.subtitle);
$('#names').innerHTML=`${names[0]}<i>&amp;</i>${names[1]}`;$('#hdate').textContent=C.mainLabel;
document.querySelectorAll('.gn').forEach(e=>e.textContent=G);document.querySelectorAll('.bn').forEach(e=>e.textContent=B);
set('#gbio',C.groomBio);set('#bbio',C.brideBio);
if(C.story){$('#storyTxt').textContent=C.story}else{$('#story').remove()}
document.title=names.join(" & ")+" | Wedding";
const mdate=C.fns.find(f=>f[0]==="Wedding")||C.fns[0];
let vc=`<div class="card rv"><b>Date</b><span>${mdate[1]}</span></div><div class="card rv" style="--d:.1s"><b>Day</b><span>${mdate[2]}</span></div><div class="card rv" style="--d:.15s"><b>Time</b><span>${mdate[3]}</span></div>`;
if(C.venue)vc+=`<div class="card rv" style="--d:.2s"><b>Venue</b><span>${C.venue}</span>${C.address?`<span class="sub-addr">${C.address}</span>`:""}</div>`;
if(C.dress)vc+=`<div class="card rv" style="--d:.3s"><b>Dress code</b><span>${C.dress}</span></div>`;
$('#vcards').innerHTML=vc;
$('#vbtns').innerHTML=`<button id="cal">Add to Calendar</button>`+(C.maps?` <a class="btn ghost" href="${C.maps}" target="_blank" rel="noopener">Get Directions</a>`:"");
if(C.maps&&C.venue){const m=$('#map');m.href=C.maps;m.style.display="block";
 m.innerHTML=`<svg viewBox="0 0 300 140" width="100%" role="img" aria-label="Map"><rect width="300" height="140" rx="10" fill="#EFE3D0"/><path d="M0 100Q90 60 150 80T300 40M120 0Q140 70 90 140M200 0L230 140" stroke="#fff" stroke-width="9" fill="none"/><path d="M150 76c-14-20-14-34 0-34s14 14 0 34z" fill="#6E1423" transform="translate(0 -6) scale(1.4) translate(-60 -12)"/><circle cx="150" cy="52" r="4" fill="#F6E7C6"/></svg><b>${C.venue}</b>${C.address?`<span class="sub-addr">${C.address}</span>`:""}`}
$('#tl').innerHTML=C.fns.map((f,i)=>`<div class="ev card rv" style="--d:${i*.1}s"><i>${i+1}</i><h3>${f[0]}</h3><p>${f[1]} &middot; ${f[2]}<br>${f[3]}${(f[4]||C.venue)?`<br>${f[4]||C.venue}`:""}${(f[5]||C.dress)?`<br><em>${f[5]||C.dress}</em>`:""}</p>${C.maps?`<a href="${C.maps}" target="_blank" rel="noopener">Get Directions</a>`:""}</div>`).join("");

/* ===== UPDATED IMAGES ARRAY ===== */
const P=[
  ["https://i.ibb.co/Jwk1z4F8/e6c3b3990e5ca0b21833ce8ba4394e87.jpg","50% 30%","Couple Portrait 1"],
  ["https://i.ibb.co/1G2vbbW2/94d3fb69c9491d89d3975d3537bd58c8.jpg","50% 30%","Couple Rings"],
  ["https://i.ibb.co/C3RS3dZb/85ad6f36433bd6c2e03174a3de6e927c.jpg","50% 50%","Wedding Flowers Setup"],
  ["https://i.ibb.co/XkzR4nDp/75485c40c639fd251d18267db9fee203.jpg","50% 40%","Romantic Ceremony Moment"]
];

$('#alb').innerHTML=P.map((p,i)=>`<button data-i="${i}" class="rv" style="--d:${i*.1}s" aria-label="Open photo ${i+1}"><img src="${p[0]}" alt="${p[2]}" loading="lazy" style="object-position:${p[1]}"></button>`).join("");
$('#fn').textContent=names.join(" & ");$('#fd').textContent=C.mainLabel;
set('#fv',C.venue?(C.address?`${C.venue} — ${C.address}`:C.venue):"");
set('#fm',C.footer);set('#ff',C.families);
if(C.rsvp){const w=$('#wa');w.hidden=false;w.href=`https://wa.me/${C.rsvp.replace(/\D/g,"")}?text=${encodeURIComponent(`Hi, I will attend the wedding of ${G} and ${B}.`)}`}else $('#wa').remove();

/* ===== OPEN REVEAL & AUTOPLAY MUSIC ===== */
const env=$('#env');let opened=false;
function openEnv(){
  if(opened)return;opened=true;env.classList.add('open');
  
  bgAudio.play().then(() => {
    sndBtn.classList.add('playing');
    sndBtn.innerHTML = '⏸';
  }).catch(e => console.log("Audio autoplay blocked by browser"));

  if(!RM)for(let i=0;i<16;i++){const s=document.createElement('i');s.className='sp';const a=i/16*6.28;s.style.cssText=`--x:${Math.cos(a)*150}px;--y:${Math.sin(a)*150}px`;env.appendChild(s)}
  setTimeout(()=>{env.classList.add('gone');document.body.classList.remove('lock');start()},RM?0:1500)
}
$('#seal').addEventListener('click',openEnv);

/* ===== COUNTDOWN (fixed +05:30) ===== */
const T=Date.parse(C.main);
function tick(){const d=T-Date.now();if(d<=0){$('#cd').hidden=true;$('#jm').hidden=false;return}
 const v=[d/864e5,d/36e5%24,d/6e4%60,d/1e3%60];['d','h','m','s'].forEach((k,i)=>$('#'+k).textContent=String(Math.floor(v[i])).padStart(i?2:1,'0'))}
tick();setInterval(tick,1000);
/* ===== CALENDAR (.ics) ===== */
$('#cal').onclick=()=>{const f=t=>new Date(t).toISOString().replace(/[-:]|\.\d{3}/g,"");
 const ev=C.fns.map(x=>{const s=x[6]?Date.parse(x[6]):Date.parse(`${x[1]} ${x[3]} GMT+0530`);return `BEGIN:VEVENT\nUID:${x[0]}-${s}@invite\nDTSTAMP:${f(Date.now())}\nDTSTART:${f(s)}\nDTEND:${f(s+72e5)}\nSUMMARY:${x[0]} - ${names.join(" & ")}\n${(x[4]||C.venue)?`LOCATION:${x[4]||C.venue}\n`:""}END:VEVENT`}).join("\n");
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//invite//EN\n${ev}\nEND:VCALENDAR`],{type:'text/calendar'}));a.download='wedding.ics';a.click()};
/* ===== LIGHTBOX ===== */
const lb=$('#lb'),li=lb.querySelector('img');let k=0;
function show(i){k=(i+P.length)%P.length;li.src=P[k][0];li.alt=P[k][2];lb.querySelector('em').textContent=`${k+1} / ${P.length}`}
$('#alb').onclick=e=>{const b=e.target.closest('button');if(b){show(+b.dataset.i);lb.classList.add('on')}};
lb.querySelector('.p').onclick=()=>show(k-1);lb.querySelector('.n').onclick=()=>show(k+1);lb.querySelector('.x').onclick=()=>lb.classList.remove('on');
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(k-1);if(e.key==='ArrowRight')show(k+1)});
let tx=0;lb.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(k+(d<0?1:-1))},{passive:true});
/* ===== WISH LANTERNS ===== */
$('#wish').onclick=()=>{for(let i=0;i<3;i++){const l=document.createElement('i');l.className='lan';l.style.left=(18+i*28)+'vw';l.style.setProperty('--x',(i-1)*40+'px');l.style.animationDelay=i*.5+'s';document.body.appendChild(l);setTimeout(()=>l.remove(),8500)}};
/* ===== SCROLL REVEAL ===== */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
/* ===== FLIGHT PATH ===== */
const base=$('#base'),trail=$('#trail'),pl=$('#pl'),plane=$('#plane');let L=0;
function build(){const W=innerWidth,H=document.documentElement.scrollHeight,n=7,st=H/n;plane.setAttribute('width',W);plane.setAttribute('height',H);plane.style.height=H+'px';
 let d=`M${W*.1} 0`;for(let i=0;i<n;i++){const x=i%2?W*.1:W*.9,y0=i*st,y1=y0+st;d+=` C${W*(i%2?.9:.1)} ${y0+st*.5} ${x} ${y0+st*.5} ${x} ${y1}`}
 base.setAttribute('d',d);trail.setAttribute('d',d);L=base.getTotalLength();move()}
function move(){if(!L)return;const ty=scrollY+innerHeight*.42;let lo=0,hi=L;for(let i=0;i<18;i++){const m=(lo+hi)/2;base.getPointAtLength(m).y<ty?lo=m:hi=m}
 const p=base.getPointAtLength(lo),q=base.getPointAtLength(Math.min(L,lo+3));pl.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI})`);$('#tr').setAttribute('height',p.y)}
/* ===== EFFECTS (after reveal) ===== */
function start(){build();addEventListener('resize',build);new ResizeObserver(build).observe(document.body);
 if(RM)return;
 const art=$('#art');addEventListener('scroll',()=>{art.style.transform=`translateY(${scrollY*.35}px)`;move()},{passive:true});
 const mob=innerWidth<700;
 for(let i=0;i<(mob?10:18);i++){const p=document.createElement('i'),s=10+Math.random()*10;p.className='pet';p.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s*1.3}px;animation-duration:${14+Math.random()*12}s;animation-delay:-${Math.random()*20}s;--sw:${(Math.random()-.5)*160}px`;document.body.appendChild(p)}
 for(let i=0;i<30;i++){const g=document.createElement('i');g.className='gl';g.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;animation-delay:-${Math.random()*3}s;animation-duration:${2.5+Math.random()*3}s;width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;background:${Math.random()<.5?'#E6CE98':'#B8924A'}`;document.body.appendChild(g)}
 /* candle-glow cursor trail + tap ripples; sleeps when idle */
 const cv=$('#fx'),cx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);let pts=[],rp=[],run=false;
 const fit=()=>{cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0)};fit();addEventListener('resize',fit);
 const wake=()=>{if(!run){run=true;requestAnimationFrame(draw)}};
 addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){pts.push({x:e.clientX,y:e.clientY,t:performance.now()});if(pts.length>22)pts.shift();wake()}},{passive:true});
 addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){rp.push({x:e.clientX,y:e.clientY,t:performance.now()});wake()}},{passive:true});
 function draw(now){cx.clearRect(0,0,innerWidth,innerHeight);pts=pts.filter(p=>now-p.t<700);rp=rp.filter(r=>now-r.t<900);
  pts.forEach((p,i)=>{const a=(1-(now-p.t)/700),f=.85+Math.random()*.15,r=(i===pts.length-1?70:34)*f,g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
   g.addColorStop(0,`rgba(255,200,110,${.30*a*f})`);g.addColorStop(.5,`rgba(255,160,60,${.12*a})`);g.addColorStop(1,'rgba(255,150,50,0)');cx.fillStyle=g;cx.fillRect(p.x-r,p.y-r,r*2,r*2)});
  rp.forEach(r=>{const u=(now-r.t)/900;cx.strokeStyle=`rgba(255,170,70,${.5*(1-u)})`;cx.lineWidth=2;cx.beginPath();cx.arc(r.x,r.y,10+u*60,0,6.28);cx.stroke()});
  if(pts.length||rp.length)requestAnimationFrame(draw);else{run=false;cx.clearRect(0,0,innerWidth,innerHeight)}}}
if(RM){}
addEventListener('load',build);
addEventListener('keydown',e=>{if(!opened&&document.activeElement===$('#seal')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openEnv()}});
</script></body></html>
